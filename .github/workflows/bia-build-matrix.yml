name: Bia build matrix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Build scope
        required: true
        default: first-signal
        type: choice
        options:
          - first-signal
          - full-matrix
      target:
        description: Single target override
        required: true
        default: auto
        type: choice
        options:
          - auto
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64

permissions:
  contents: read

jobs:
  matrix:
    name: Select build matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Select targets
        id: targets
        shell: bash
        run: |
          scope="first-signal"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="${{ inputs.scope }}"
            target="${{ inputs.target }}"
          else
            target="auto"
          fi

          case "$target" in
            linux-x86_64)
              targets='{"include":[{"name":"linux-x86_64","runner":"ubuntu-latest","rust_target":"","binary_path":"target/release/bia"}]}'
              ;;
            linux-aarch64)
              targets='{"include":[{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","rust_target":"","binary_path":"target/release/bia"}]}'
              ;;
            macos-x86_64)
              targets='{"include":[{"name":"macos-x86_64","runner":"macos-13","rust_target":"","binary_path":"target/release/bia"}]}'
              ;;
            macos-aarch64)
              targets='{"include":[{"name":"macos-aarch64","runner":"macos-14","rust_target":"","binary_path":"target/release/bia"}]}'
              ;;
            auto)
              case "$scope" in
                full-matrix)
                  targets='{"include":[{"name":"linux-x86_64","runner":"ubuntu-latest","rust_target":"","binary_path":"target/release/bia"},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","rust_target":"","binary_path":"target/release/bia"},{"name":"macos-x86_64","runner":"macos-13","rust_target":"","binary_path":"target/release/bia"},{"name":"macos-aarch64","runner":"macos-14","rust_target":"","binary_path":"target/release/bia"}]}'
                  ;;
                first-signal)
                  targets='{"include":[{"name":"linux-x86_64","runner":"ubuntu-latest","rust_target":"","binary_path":"target/release/bia"},{"name":"macos-aarch64","runner":"macos-14","rust_target":"","binary_path":"target/release/bia"}]}'
                  ;;
                *)
                  echo "unknown scope: $scope" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unknown target: $target" >&2
              exit 1
              ;;
          esac

          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BIA_STATIC_PHP_PREFIX: ${{ github.workspace }}/.ripht/php
      RIPHT_PHP_SAPI_PREFIX: ${{ github.workspace }}/.ripht/php
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison build-essential cmake curl git libc++-dev libc++abi-dev libtool make perl pkg-config re2c unzip

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for formula in autoconf automake bison cmake libtool re2c; do
            brew list --formula "$formula" >/dev/null 2>&1 || brew install "$formula"
          done
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix re2c)/bin" >> "$GITHUB_PATH"

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          if [ -n "${{ matrix.rust_target }}" ]; then
            rustup target add "${{ matrix.rust_target }}"
          fi

      - name: Build static PHP runtime
        shell: bash
        run: ./scripts/build-static-engine.sh

      - name: Build Bia release binary
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --package bia --release --target "${{ matrix.rust_target }}"
          else
            cargo build --package bia --release
          fi

      - name: Smoke release binary
        shell: bash
        run: |
          "${{ matrix.binary_path }}" --version
          "${{ matrix.binary_path }}" doctor
          "${{ matrix.binary_path }}" -r '1 + 1'
          "${{ matrix.binary_path }}" -r 'bia()->dump("hello")'

      - name: Smoke embedded runtime
        shell: bash
        run: |
          "${{ matrix.binary_path }}" -r 'foreach (["Phalanx\\Http\\FastRouteCompiler", "Phalanx\\Worker\\WorkerPool\\WorkerPool", "Phalanx\\DevServer\\ManagedProcess", "Phalanx\\WebSocket\\WsRouteConfig", "Phalanx\\Network\\Subnet", "GuzzleHttp\\Psr7\\ServerRequest", "Psr\\Http\\Message\\ResponseInterface", "FastRoute\\FastRoute", "IPLib\\Factory", "Symfony\\Component\\Runtime\\GenericRuntime", "Symfony\\Runtime\\Symfony\\Component\\Console\\ApplicationRuntime"] as $symbol) { if (!class_exists($symbol) && !interface_exists($symbol)) { throw new RuntimeException("missing " . $symbol); } }'
          "${{ matrix.binary_path }}" -r 'if (!function_exists("FastRoute\\simpleDispatcher")) { throw new RuntimeException("missing FastRoute functions"); }'
          "${{ matrix.binary_path }}" -r 'dump((new Phalanx\Network\Subnet("127.0.0.0/30"))->contains("127.0.0.1"))'

      - name: Run Rust checks
        shell: bash
        run: |
          target_args=()
          if [ -n "${{ matrix.rust_target }}" ]; then
            target_args=(--target "${{ matrix.rust_target }}")
          fi
          cargo clippy --package bia --all-targets "${target_args[@]}"
          cargo test --package bia "${target_args[@]}"
          cargo test --package bia "${target_args[@]}" -- --ignored

      - name: Run gauntlet
        shell: bash
        env:
          BIA_BIN: ${{ matrix.binary_path }}
        run: bash tests/scripts/gauntlet.sh
